<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>金魚水槽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#041317;
  --panel:rgba(6,28,33,.72);
  --glass:rgba(210,238,231,.09);
  --glass-hi:rgba(210,238,231,.16);
  --line:rgba(200,236,226,.18);
  --text:#ecf5f1;
  --muted:#9dbdb5;
  --koi:#ff6a3a;
  --koi-soft:rgba(255,106,58,.18);
  --gold:#f3c870;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sheen{position:fixed;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(4,19,23,.5) 0,rgba(4,19,23,0) 140px),
    linear-gradient(112deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 18%,rgba(255,255,255,0) 72%,rgba(255,255,255,.04) 77%,rgba(255,255,255,0) 82%),
    radial-gradient(ellipse 120% 90% at 50% 45%,rgba(0,0,0,0) 62%,rgba(0,10,14,.42) 100%)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.16em;margin:0;line-height:1.1;text-shadow:0 2px 14px rgba(0,20,24,.55)}
.brand h1 small{display:block;font:500 9.5px/1.4 var(--f-ui);letter-spacing:.34em;color:var(--gold);opacity:.9;margin-top:4px}
.meta{margin:6px 0 0;font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.meta b{color:var(--text);font-weight:500}
.hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);transform:translateX(-50%);max-width:calc(100% - 32px);
  padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;letter-spacing:.04em;
  color:var(--text);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;transition:opacity .6s,transform .6s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint.off{opacity:0;transform:translate(-50%,-6px)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:stretch;gap:2px;padding:5px;
  border-radius:24px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 10px 40px rgba(0,12,16,.35);max-width:calc(100% - 20px)}
.dock .sep{width:1px;background:var(--line);margin:8px 3px}
.tool{appearance:none;border:0;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:8px 8px 7px;border-radius:19px;font:500 10.5px/1 var(--f-ui);letter-spacing:.08em;min-width:50px;cursor:pointer;transition:background .2s,color .2s}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--glass-hi)}
.tool:focus-visible,.chip:focus-visible,.card:focus-visible,.sw:focus-visible,.btn:focus-visible,.fchip:focus-visible,.x:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tool[aria-pressed="true"]{background:var(--koi-soft);color:#ffd8c8;box-shadow:inset 0 0 0 1px rgba(255,140,100,.5)}
.tool[aria-expanded="true"]{background:var(--glass-hi);color:var(--gold)}
.sub{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);display:flex;gap:6px;overflow-x:auto;
  max-width:calc(100% - 24px);padding:4px 2px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 13px;font:500 12px/1 var(--f-ui);
  letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip[aria-pressed="true"]{border-color:rgba(243,200,112,.7);color:var(--gold);background:rgba(40,34,18,.6)}
.chip.ghost{background:transparent;color:var(--muted)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:min(440px,calc(100% - 24px));
  max-height:min(62vh,560px);overflow:auto;background:var(--panel);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--line);border-radius:22px;padding:16px 16px 18px;box-shadow:0 18px 60px rgba(0,10,14,.5);box-sizing:border-box}
.sheet header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.14em;margin:0}
.sheet h3{font:500 10.5px/1 var(--f-ui);letter-spacing:.3em;color:var(--muted);margin:16px 0 8px}
.x{appearance:none;border:0;background:var(--glass);color:var(--text);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:30px;cursor:pointer}
.fishlist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fchip{appearance:none;flex:none;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:14px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center;font-family:var(--f-ui)}
.fchip .dot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.fchip b{display:block;font-weight:700;font-size:12.5px;letter-spacing:.05em}
.fchip small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.fchip[aria-pressed="true"]{border-color:rgba(243,200,112,.75);background:rgba(40,34,18,.55)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg .chip{justify-content:center;padding:9px 2px;font-size:11px;letter-spacing:0;white-space:nowrap;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--glass)}
.seg .chip[aria-pressed="true"]{background:rgba(40,34,18,.6)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:14px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:500 11.5px/1 var(--f-ui);letter-spacing:.08em}
.sw span{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 3px 10px rgba(0,0,0,.3)}
.sw[aria-pressed="true"]{border-color:rgba(243,200,112,.75);color:var(--gold)}
.row{display:flex;gap:8px;margin-top:16px}
.btn{appearance:none;flex:1;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:14px;padding:11px 10px;font:500 13px/1 var(--f-ui);letter-spacing:.06em;cursor:pointer}
.btn.primary{background:var(--koi-soft);border-color:rgba(255,140,100,.5);color:#ffd8c8}
.btn:disabled{opacity:.4;cursor:default}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:16px;padding:6px 6px 9px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;font-family:var(--f-ui)}
.card span{height:54px;border-radius:11px;display:block}
.card b{font-family:var(--f-display);font-size:15px;letter-spacing:.1em;padding:0 4px}
.card small{font-size:10px;color:var(--muted);padding:0 4px;line-height:1.35}
.card[aria-pressed="true"]{border-color:rgba(243,200,112,.75)}
.toggles{display:flex;flex-direction:column;gap:2px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;font-size:13px;letter-spacing:.05em;cursor:pointer}
.tg input{appearance:none;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;margin:0;transition:background .2s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#e9f2ef;transition:transform .2s}
.tg input:checked{background:var(--koi)}
.tg input:checked::after{transform:translateX(18px)}
.tg input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.marker{position:fixed;left:0;top:0;border:1.5px solid var(--gold);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 18px rgba(243,200,112,.45);transition:opacity .3s}
.marker::after{content:attr(data-name);position:absolute;left:50%;top:100%;transform:translate(-50%,6px);font:700 11px/1 var(--f-ui);letter-spacing:.1em;color:var(--gold);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.ring{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);pointer-events:none;animation:ring .7s ease-out forwards}
@keyframes ring{to{transform:scale(4.2);opacity:0}}
.fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:380px){ .tool{min-width:44px;padding:8px 5px 7px} .dock .sep{margin:8px 1px} .brand h1{font-size:21px} }
@media (prefers-reduced-motion:reduce){ .ring{animation-duration:.01s} .hint{transition:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="金魚の水槽"></canvas>
<div class="sheen"></div>

<div class="hud">
  <div class="brand">
    <h1>金魚水槽<small>KINGYO · SUISŌ</small></h1>
    <p class="meta"><b id="mCount">7</b>匹 · 水温 <b id="mTemp">24.6</b>℃ · <b id="mLight">昼</b>の光</p>
  </div>
</div>

<div class="hint off" id="hint" role="status"></div>
<div class="marker" id="marker" hidden></div>

<div class="sub" id="subFood" hidden>
  <button class="chip" data-food="flake" aria-pressed="true"><i style="background:linear-gradient(135deg,#e7a13a,#d9452b)"></i>フレーク</button>
  <button class="chip" data-food="pellet" aria-pressed="false"><i style="background:#8a5a2e"></i>沈下粒</button>
</div>
<div class="sub" id="subGem" hidden>
  <button class="chip" data-gem="random" aria-pressed="true"><i style="background:conic-gradient(#ff3b6b,#ffc23d,#27d39a,#3d7bff,#b56bff,#ff3b6b)"></i>おまかせ</button>
  <button class="chip" data-gem="crystal" aria-pressed="false"><i style="background:linear-gradient(135deg,#9fd0ff,#3d7bff)"></i>宝石</button>
  <button class="chip" data-gem="marble" aria-pressed="false"><i style="background:radial-gradient(circle at 35% 35%,#fff,#6fd6ff 60%,#1f7fb0)"></i>ビー玉</button>
  <button class="chip" data-gem="star" aria-pressed="false"><i style="background:linear-gradient(135deg,#fff1a8,#e0a526)"></i>星</button>
  <button class="chip" data-gem="pearl" aria-pressed="false"><i style="background:radial-gradient(circle at 35% 35%,#fff,#efe3da)"></i>真珠</button>
  <button class="chip" data-gem="heart" aria-pressed="false"><i style="background:linear-gradient(135deg,#ffb3cf,#ff4f8e)"></i>ハート</button>
  <button class="chip" data-gem="glitter" aria-pressed="false"><i style="background:conic-gradient(#fff,#ffd36b,#ff9ad0,#9ae7ff,#fff)"></i>ラメ</button>
  <button class="chip ghost" id="btnClear">片付ける</button>
</div>

<section class="sheet" id="sheetFish" hidden aria-label="金魚">
  <header><h2>金魚</h2><button class="x" data-close aria-label="閉じる">×</button></header>
  <div class="fishlist" id="fishList"></div>
  <h3>品種</h3>
  <div class="seg" id="breedSeg"></div>
  <h3>色柄</h3>
  <div class="swatches" id="colorSeg"></div>
  <div class="row">
    <button class="btn primary" id="btnAdd">＋ 仲間を入れる</button>
    <button class="btn" id="btnRemove">この子を放す</button>
  </div>
</section>

<section class="sheet" id="sheetLight" hidden aria-label="光">
  <header><h2>光</h2><button class="x" data-close aria-label="閉じる">×</button></header>
  <div class="cards" id="lightCards"></div>
  <h3>水槽</h3>
  <div class="toggles">
    <label class="tg" for="tgRays">光の筋<input type="checkbox" id="tgRays" checked></label>
    <label class="tg" for="tgAir">エアレーション<input type="checkbox" id="tgAir" checked></label>
    <label class="tg" for="tgMotes">水中の粒子<input type="checkbox" id="tgMotes" checked></label>
  </div>
</section>

<nav class="dock" aria-label="道具">
  <button class="tool" data-tool="watch" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>観る</button>
  <button class="tool" data-tool="food" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M6 4.5l2.5 1.2-1 2.3L5 7z"/><path d="M13 3.5l2.3.6-.5 2.4-2.4-.7z"/><path d="M9.5 10.5l2.6.4-.4 2.6-2.6-.5z"/><path d="M16 11l2.2 1-1 2.1-2.1-1z"/><path d="M11.5 17l2.4.7-.7 2.3-2.3-.8z"/></svg>餌</button>
  <button class="tool" data-tool="gem" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M9 4l3 16M15 4l-3 16"/></svg>きらきら</button>
  <button class="tool" data-tool="bubble" aria-pressed="false">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="15" r="5"/><circle cx="16.5" cy="7.5" r="3"/><circle cx="18" cy="15.5" r="1.6"/><path d="M6.5 13.2a2.6 2.6 0 0 1 2-1.7"/></svg>泡</button>
  <span class="sep"></span>
  <button class="tool" id="openFish" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M3 12c2.8-4 6.6-5.5 10-5 3 .5 5 2.5 6 5-1 2.5-3 4.5-6 5-3.4.5-7.2-1-10-5z"/><path d="M19 12l2.5-3.5v7z"/><circle cx="8" cy="11" r=".9" fill="currentColor"/></svg>金魚</button>
  <button class="tool" id="openLight" aria-expanded="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>光</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.body.insertAdjacentHTML('beforeend','<div class="fail">3Dライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。</div>'); return; }

/* ================================================================
   Utilities
   ================================================================ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash3(x, y, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1440662683); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi), c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1), c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u, x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}
function fbm3(x, y, z, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise3(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const lin = h => new THREE.Color(h).convertSRGBToLinear();
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};

/* ================================================================
   Renderer / scene
   ================================================================ */
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="fail">この端末ではWebGLが使えないため、水槽を表示できません。</div>');
  return;
}
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const maxPR = Math.min(window.devicePixelRatio || 1, 2);
let pixelRatio = Math.min(maxPR, 1.75);
renderer.setPixelRatio(pixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 100);
scene.fog = new THREE.Fog(0x1f6b72, 10, 30);

// Tank dimensions (world units, 1 unit ≈ 5 cm)
const T = { W: 10, H: 6, D: 5, fov: 42, aspect: 1, floor: -2.65, surf: 2.95, camDist: 10 };
function computeTank(aspect) {
  let W, H;
  if (aspect >= 1) { H = 6; W = H * aspect; } else { W = 5.4; H = W / aspect; }
  const D = clamp(Math.min(W, H) * 0.85, 4, 6);
  return { W, H, D, fov: aspect < 1 ? 50 : 40, aspect };
}
function applyCamera() {
  camera.fov = T.fov; camera.aspect = T.aspect;
  T.camDist = (T.H * 0.955 / 2) / Math.tan(THREE.MathUtils.degToRad(T.fov / 2));
  camera.position.set(0, 0, T.D / 2 + T.camDist);
  camera.near = 0.5; camera.far = T.camDist + T.D * 3;
  camera.updateProjectionMatrix();
  camera.lookAt(0, 0, 0);
  scene.fog.near = T.camDist * 0.92; scene.fog.far = T.camDist + T.D * 2.6;
}
function floorY(x, z) {
  const back = clamp(0.5 - z / T.D, 0, 1);
  return T.floor + 0.1 * Math.sin(x * 0.8 + 1.3) * Math.cos(z * 1.1 + 0.4) + 0.18 * (vnoise3(x * 0.45 + 10, z * 0.45, 0.5) - 0.5) + back * back * 0.55;
}
function floorNormal(x, z, out) {
  const e = 0.05;
  out.set(floorY(x - e, z) - floorY(x + e, z), 2 * e, floorY(x, z - e) - floorY(x, z + e)).normalize();
  return out;
}

/* ================================================================

const CAUSTIC_FN = `
float causticF(vec2 uv, float t){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.0;

#ifdef SWAY
attribute vec3 aSway;
#endif

  transformed.x += (sin(uTime*0.7 + aSway.z + transformed.y*0.6)*0.8 + sin(uTime*1.7 + aSway.z*2.3)*0.2) * w;

#endif
`;

const C_FRAG_HEAD = `

uniform vec4 uShadows[${MAX_SHADOWS}]; uniform int uShadowN; uniform float uShadowAmt;
#endif

  for (let i = 0; i < nGravel; i++) {
    const x = rr(-W / 2 + 0.04, W / 2 - 0.04), z = rr(-D / 2 + 0.04, D / 2 - 0.04);
    const s = rr(0.035, 0.085);
    dm.position.set(x, floorY(x, z) - 0.01, z);
    dm.rotation.set(rr(0, TAU), rr(0, TAU), rr(0, TAU));
    dm.scale.set(s * rr(0.9, 1.4), s * rr(0.55, 0.8), s * rr(0.8, 1.2));
    dm.updateMatrix(); gravel.setMatrixAt(i, dm.matrix);

    gravel.setColorAt(i, col);
  }
  group.add(gravel);

  // Plants: vallisneria ribbons + round-leaf stem plants, one merged geometry with per-vertex sway
  const P = { pos: [], nor: [], col: [], sway: [], idx: [] };
  const pushV = (x, y, z, nx, ny, nz, c, sw) => { P.pos.push(x, y, z); P.nor.push(nx, ny, nz); P.col.push(c.r, c.g, c.b); P.sway.push(sw[0], sw[1], sw[2]); return P.pos.length / 3 - 1; };
  const shade = (hex, k) => { const c = new THREE.Color(hex); c.multiplyScalar(k); return c.convertSRGBToLinear(); };

  function ribbon(x0, z0, height, width, color, phase) {
    const y0 = floorY(x0, z0) - 0.05; const n = 14; const sw = [y0, height, phase];
    const a0 = rr(0, TAU), tw = rr(-1.4, 1.4), lx = rr(-0.5, 0.5), lz = rr(-0.3, 0.3);
    let prevL = -1, prevR = -1;
    for (let i = 0; i <= n; i++) {
      const h = i / n, y = y0 + h * height, w = width * (1 - h * 0.65) * (i === n ? 0.2 : 1);
      const cx = x0 + lx * h * h * height * 0.35, cz = z0 + lz * h * h * height * 0.35;
      const a = a0 + tw * h, ca = Math.cos(a), sa = Math.sin(a);
      const k = 0.5 + 0.6 * h;

      const l = pushV(cx - ca * w / 2, y, cz - sa * w / 2, -sa, 0, ca, c, sw);
      const r = pushV(cx + ca * w / 2, y, cz + sa * w / 2, -sa, 0, ca, c, sw);

    }
  }

    const nodes = Math.floor(height / 0.17);

      const h = i / nodes, y = y0 + h * height;
      const base = i * 1.5708 + phase;
      const len = 0.17 * (1 - h * 0.35), wd = 0.075 * (1 - h * 0.3);

        const a = base + s, ca = Math.cos(a), sa = Math.sin(a);
        const c = shade(leafColor, 0.6 + 0.55 * h);
        const tip = [x0 + ca * len, y + 0.05, z0 + sa * len];
        const mid = [x0 + ca * len * 0.45, y + 0.02, z0 + sa * len * 0.45];
        const px = -sa * wd, pz = ca * wd;
        const i0 = pushV(x0, y, z0, 0, 1, 0, c, sw);
        const i1 = pushV(mid[0] + px, mid[1], mid[2] + pz, 0, 1, 0, c, sw);
        const i2 = pushV(tip[0], tip[1], tip[2], 0, 1, 0, c, sw);
        const i3 = pushV(mid[0] - px, mid[1], mid[2] - pz, 0, 1, 0, c, sw);
        P.idx.push(i0, i1, i2, i0, i2, i3);
      }
    }

    const n = 10; let pl = -1, pr = -1;
    for (let i = 0; i <= n; i++) {

      const c = shade('#4f7a36', 0.7 + 0.3 * h);
      const l = pushV(x0 - w, y, z0, 0, 0, 1, c, sw), r = pushV(x0 + w, y, z0, 0, 0, 1, c, sw);

  }
  const greens = ['#3f8f4a', '#5fae55', '#2f6f3d', '#6fbf5a', '#4a9a4f'];
  const clusters = Math.max(3, Math.round(W / 2.2));
  for (let c = 0; c < clusters; c++) {
    const cx = lerp(-W / 2 + 0.6, W / 2 - 0.6, (c + rr(0.1, 0.9)) / clusters);
    const cz = rr(-D / 2 + 0.35, -D * 0.12);
    const blades = 7 + ((R() * 8) | 0);
    for (let b = 0; b < blades; b++) {
      const x = cx + rr(-0.45, 0.45), z = cz + rr(-0.3, 0.3);
      ribbon(x, z, rr(0.45, 1) * hMax, rr(0.07, 0.11), greens[(R() * greens.length) | 0], rr(0, TAU));
    }
  }
  const stems = Math.max(2, Math.round(W / 3));
  for (let s = 0; s < stems; s++) {
    const side = s % 2 ? 1 : -1;
    const bx = side * (W / 2 - rr(0.35, 0.9)), bz = rr(-D / 2 + 0.3, D * 0.1);
    const col2 = R() < 0.35 ? '#c0603f' : '#6cbf4e';
    for (let k = 0; k < 4; k++) stemPlant(bx + rr(-0.25, 0.25), bz + rr(-0.2, 0.2), rr(0.35, 0.7) * hMax, col2, rr(0, TAU));
  }
  const pg = new THREE.BufferGeometry();

  pg.setIndex(P.idx);
  const plantMat = withCaustics(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55, emissive: 0x0b2a10, emissiveIntensity: 0.6 }), { caust: 0.55, shadow: 0.5, sway: true });
  const plants = new THREE.Mesh(pg, plantMat); plants.frustumCulled = false;
  group.add(plants);

  // Air stone + tube
  const ax = -W / 2 + 0.75, az = -D / 2 + 0.6;
  env.air = { x: ax, z: az, y: floorY(ax, az) + 0.06 };
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 0.12, 20), withCaustics(new THREE.MeshStandardMaterial({ color: lin('#8d8f93'), roughness: 1 }), { caust: 0.8 }));
  stone.position.set(ax, env.air.y, az); group.add(stone);
  const tubeMat = new THREE.MeshPhysicalMaterial({ color: lin('#cfeee6'), roughness: 0.1, transparent: true, opacity: 0.35, clearcoat: 1 });
  const tubeH = T.surf + 0.5 - env.air.y;
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, tubeH, 10), tubeMat);
  tube.position.set(ax, env.air.y + tubeH / 2, -D / 2 + 0.1); group.add(tube);
  const link = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, az - (-D / 2 + 0.1), 10), tubeMat);
  link.rotation.x = Math.PI / 2; link.position.set(ax, env.air.y, (az + (-D / 2 + 0.1)) / 2); group.add(link);

  // Water surface seen from below
  const surfMat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.time, uA: { value: new THREE.Color() }, uB: { value: new THREE.Color() }, uRip: { value: rippleU }, uD: { value: D } },
    vertexShader: WALL_VS, fragmentShader: SURF_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide });
  const surf = new THREE.Mesh(new THREE.PlaneGeometry(W, D), surfMat);
  surf.rotation.x = Math.PI / 2; surf.position.y = T.surf; surf.renderOrder = 8;
  group.add(surf); env.surfMat = surfMat;

  // Light shafts
  const nRays = Math.max(4, Math.round(W / 1.4));
  for (let i = 0; i < nRays; i++) {
    const m = new THREE.ShaderMaterial({ uniforms: { uTime: U.time, uColor: { value: new THREE.Color() }, uI: { value: 0 }, uSeed: { value: R() } },
      vertexShader: RAY_VS, fragmentShader: RAY_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
    const rw = rr(0.5, 1.5), rh = H * 1.25;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rw, rh), m);
    mesh.position.set(lerp(-W / 2, W / 2, (i + rr(0.2, 0.8)) / nRays), T.surf - rh / 2 + 0.3, rr(-D / 2 + 0.3, D * 0.15));
    mesh.rotation.z = -0.28 + rr(-0.06, 0.06); mesh.rotation.y = rr(-0.3, 0.3);
    mesh.renderOrder = 9;
    group.add(mesh); env.rays.push(mesh);
  }

  lamp.position.set(W * 0.2, T.surf - 0.2, D / 2 - 0.4);
  scene.add(group);
}

const rippleU = Array.from({ length: 12 }, () => new THREE.Vector4(0, 0, -99, 0));
let rippleIdx = 0;

/* ================================================================
   Water flow from the bubble plume
   ================================================================ */
const flowOut = new THREE.Vector3();
function flowAt(p) {
  flowOut.set(0, 0, 0);
  if (!airOn || !env) return flowOut;
  const dx = p.x - env.air.x, dz = p.z - env.air.z, r2 = dx * dx + dz * dz;
  flowOut.y = 0.55 * Math.exp(-r2 / 0.18);
  if (p.y > T.surf - 1.0) {
    const r = Math.sqrt(r2) + 1e-3, k = 0.35 * Math.exp(-r2 / 2.5) * smooth(T.surf - 1.0, T.surf, p.y);
    flowOut.x += dx / r * k; flowOut.z += dz / r * k;
  }
  return flowOut;
}

/* ================================================================
   Bubbles

const BUB_MAX = 400;

  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 w = modelMatrix * instanceMatrix * vec4(position,1.0); vec4 mv = viewMatrix * w;
      vN = normalize(normalMatrix * mat3(instanceMatrix) * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uTint; varying vec3 vN; varying vec3 vV;
    void main(){ vec3 n = normalize(vN); vec3 v = normalize(vV); float f = 1.0 - max(dot(n, v), 0.0);
      float rim = pow(f, 2.2);
      float s1 = pow(max(dot(n, normalize(vec3(-0.35, 0.75, 0.6) + v)), 0.0), 70.0);
      float s2 = pow(max(dot(n, normalize(vec3(0.3, -0.7, 0.5) + v)), 0.0), 18.0) * 0.35;
      vec3 col = mix(uTint, vec3(1.0), rim*0.6) + s1 + s2;

  transparent: true, depthWrite: false });
const bubbleMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 16, 12), bubbleMat, BUB_MAX);
bubbleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bubbleMesh.frustumCulled = false; bubbleMesh.renderOrder = 7; bubbleMesh.count = 0;
scene.add(bubbleMesh);
const bubbles = [];
function spawnBubble(x, y, z, r, vy = 0) {
  if (bubbles.length >= BUB_MAX) bubbles.shift();
  bubbles.push({ x, y, z, r, vy, ph: rand(0, TAU), wf: rand(5, 11), wa: rand(0.08, 0.22) });
}
let airAcc = 0;
const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), bs = new THREE.Vector3(), bp = new THREE.Vector3();
function updateBubbles(dt, t) {
  if (airOn && env) {
    airAcc += dt * 20;
    while (airAcc > 1) {
      airAcc -= 1;
      const big = Math.random() < 0.12;
      spawnBubble(env.air.x + rand(-0.07, 0.07), env.air.y + 0.08, env.air.z + rand(-0.07, 0.07), big ? rand(0.045, 0.07) : rand(0.012, 0.035), 0.3);

    const wob = Math.sin(t * b.wf + b.ph);

    b.z += Math.cos(t * b.wf * 0.9 + b.ph) * b.wa * dt;
    b.y += b.vy * dt;
    b.r *= 1 + dt * 0.02;
    if (b.y > T.surf - b.r * 0.6) {

      if (Math.random() < 0.5) addGlint(b.x, T.surf - 0.02, b.z, 0.12 + b.r * 2, 0.35);

    bp.set(b.x, b.y, b.z); bs.set(b.r * (1 + sq), b.r * (1 - sq), b.r * (1 + sq * 0.5));

   Glints (sparkles) & puffs

const glints = [];
function addGlint(x, y, z, size, life, color) {
  if (glints.length > 600) glints.shift();

}
const puffs = [];
function addPuff(x, y, z, color, n, spread, rise = 0.15, size = 0.12) {
  for (let i = 0; i < n; i++) {
    if (puffs.length > 280) puffs.shift();
    puffs.push({ x, y, z, vx: rand(-spread, spread), vy: rand(0.02, rise), vz: rand(-spread, spread), life: rand(0.9, 1.8), max: 1.8, c: color, s: rand(size * 0.6, size * 1.2) });

}
const white = new THREE.Color(1, 1, 1), tmpCol = new THREE.Color();
function drawGlints(dt) {
  glintPool.begin();

    const g = glints[i]; g.life -= dt;
    if (g.life <= 0) { glints.splice(i, 1); continue; }
    const k = Math.sin(Math.PI * (1 - g.life / g.max));

  }
  drawGlitter();
  glintPool.end();
  puffPool.begin();
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life -= dt;
    if (p.life <= 0) { puffs.splice(i, 1); continue; }
    p.vx *= 1 - dt * 1.5; p.vz *= 1 - dt * 1.5; p.vy -= dt * 0.08;

    const k = p.life / p.max;

}

/* Ambient motes drifting in the water */

  for (let i = 0; i < n; i++) motes.push({ x: rand(-T.W / 2, T.W / 2), y: rand(T.floor, T.surf), z: rand(-T.D / 2, T.D / 2), s: rand(0.02, 0.06), ph: rand(0, 100) });

}
function actAt(cx, cy, first) {

  if (tool === 'food') { dropFood(x, rand(-T.D * 0.3, T.D * 0.25)); if (first) ring(cx, cy); }

}
function pickFishAt(cx, cy) {
  let best = null, bd = 70;
  for (const f of fishes) {
    tv.copy(f.pos).project(camera);
    const sx = (tv.x + 1) / 2 * innerWidth, sy = (1 - tv.y) / 2 * innerHeight;

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  if (openSheet) {
    const f = openSheet === 'fish' ? pickFishAt(e.clientX, e.clientY) : null;
    if (f) { selected = f; renderFishSheet(); return; }
    closeSheets(); return;
  }
  down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, last: 0, held: false };
  if (tool === 'watch') return;

});
canvas.addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth - 0.5; pointer.y = e.clientY / innerHeight - 0.5;
  if (!down || e.pointerId !== down.id) return;
  down.cx = e.clientX; down.cy = e.clientY;
  if (tool === 'food') {
    const now = performance.now();
    if (now - down.last > 140 && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 20) { down.last = now; actAt(e.clientX, e.clientY, false); }
  }
});

}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
const pointer = { x: 0, y: 0 };
function updateHeld() {

  const held = performance.now() - down.t;
  const cx = down.cx ?? down.x, cy = down.cy ?? down.y;
  if (tool === 'watch' && held > 350) {
    down.held = true; attract.on = true;
    const p = screenToPlane(cx, cy, T.D / 2 - 0.5);

    const b = document.createElement('button'); b.className = 'card'; b.setAttribute('aria-pressed', String(k === lightKey));
    b.innerHTML = `<span style="background:${p.swatch}"></span><b>${p.label}</b><small>${p.note}</small>`;
    b.addEventListener('click', () => { lightKey = k; $('#mLight').textContent = p.label; save(); renderLightSheet(); });
    c.appendChild(b);
  }
}
$('#tgRays').addEventListener('change', e => { raysOn = e.target.checked; save(); });
$('#tgAir').addEventListener('change', e => { airOn = e.target.checked; save(); });
$('#tgMotes').addEventListener('change', e => { motesOn = e.target.checked; save(); });

function save() {
  store.set('kingyo-suiso-v1', { fish: fishes.map(f => ({ breed: f.breed, look: f.look, name: f.name, size: f.size, seed: f.seed })), light: lightKey, rays: raysOn, air: airOn, motes: motesOn });
}

/* ================================================================
   Boot
   ================================================================ */
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const nt = computeTank(w / h);
  const changed = !env || Math.abs(nt.W - T.W) > 0.01 || Math.abs(nt.H - T.H) > 0.01;
  Object.assign(T, nt);
  T.floor = -T.H / 2 + 0.35; T.surf = T.H / 2 - 0.05;
  applyCamera();
  U.pointScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(T.fov / 2)));
  if (changed) {
    buildEnvironment(); seedMotes();
    for (const f of fishes) { const b = f.bounds('hard'); f.pos.x = clamp(f.pos.x, b.x0, b.x1); f.pos.z = clamp(f.pos.z, b.z0, b.z1); f.pos.y = clamp(f.pos.y, floorY(f.pos.x, f.pos.z) + 0.3, T.surf - 0.3); f.randomGoal(f.goal); }
    for (const g of gems) { g.pos.x = clamp(g.pos.x, -T.W / 2 + g.r, T.W / 2 - g.r); g.pos.z = clamp(g.pos.z, -T.D / 2 + g.r, T.D / 2 - g.r); g.pos.y = Math.max(g.pos.y, floorY(g.pos.x, g.pos.z) + g.r); }
    foods.forEach(f => { f.pos.y = Math.min(f.pos.y, T.surf - 0.03); });
    bubbles.length = 0;
  }
}
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(onResize, 120); });

const saved = store.get('kingyo-suiso-v1');
if (saved) {
  if (LIGHTS[saved.light]) lightKey = saved.light;
  raysOn = saved.rays !== false; airOn = saved.air !== false; motesOn = saved.motes !== false;
}
$('#tgRays').checked = raysOn; $('#tgAir').checked = airOn; $('#tgMotes').checked = motesOn;
$('#mLight').textContent = LIGHTS[lightKey].label;
setLightImmediate(lightKey);
onResize();
const DEFAULT_FISH = [
  { breed: 'ryukin', look: 'aka', name: 'あかね' }, { breed: 'ryukin', look: 'sarasa', name: 'さらさ' }, { breed: 'oranda', look: 'tancho', name: 'つばき' },
  { breed: 'demekin', look: 'kuro', name: 'くろまめ' }, { breed: 'wakin', look: 'aka', name: 'ひなた' }, { breed: 'comet', look: 'sakura', name: 'もも' },
  { breed: 'ryukin', look: 'sanshoku', name: 'みぞれ' }
];
const initial = saved && Array.isArray(saved.fish) && saved.fish.length ? saved.fish.filter(f => BREEDS[f.breed] && LOOKS[f.look]).slice(0, 12) : DEFAULT_FISH;
for (const o of (initial.length ? initial : DEFAULT_FISH)) fishes.push(new Fish(o));
$('#mCount').textContent = fishes.length;
setTool('food');
hint('水槽をタップすると餌が落ちます', 4200);
updateLights(1);

// A little life before the first tap: a few flakes already drifting, a pearl on the sand
setTimeout(() => { if (!foods.length) dropFood(rand(-T.W * 0.2, T.W * 0.2), 0); }, 900);

let last = performance.now(), ftAcc = 0, ftN = 0, lastAdj = last, tempT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.min(0.1, (now - last) / 1000); last = now;
  const dt = Math.min(raw, 1 / 30);
  const t = (U.time.value += dt);
  rayFade += ((raysOn ? 1 : 0) - rayFade) * Math.min(1, dt * 3);
  updateLights(dt);
  updateHeld();
  updateBubbles(dt, t);
  updateFood(dt, t);
  updateGems(dt, t);
  updateGlitter(dt, t);
  for (const f of fishes) f.update(dt, t);
  // shadows cast on the bed (fish + objects)
  let n = 0; const sh = U.shadows.value;
  for (const f of fishes) { if (n >= MAX_SHADOWS) break; sh[n++].set(f.pos.x + (f.pos.y - T.floor) * 0.1, f.pos.y, f.pos.z - (f.pos.y - T.floor) * 0.04, 0.32 * f.size); }
  for (const g of gems) { if (n >= MAX_SHADOWS) break; sh[n++].set(g.pos.x, g.pos.y, g.pos.z, g.r * 1.1); }
  U.shadowN.value = n;
  drawGlints(dt); drawMotes(dt, t);
  // gentle parallax
  camera.position.x = lerp(camera.position.x, pointer.x * 0.25 + Math.sin(t * 0.13) * 0.06, Math.min(1, dt * 2));
  camera.position.y = lerp(camera.position.y, -pointer.y * 0.18 + Math.sin(t * 0.11) * 0.04, Math.min(1, dt * 2));
  camera.lookAt(0, 0, 0);
  // selected-fish marker
  if (openSheet === 'fish' && selected) {
    tv.copy(selected.pos).project(camera);
    const m = $('#marker'), px = (tv.x + 1) / 2 * innerWidth, py = (1 - tv.y) / 2 * innerHeight;
    const sz = 90 * selected.size * (T.camDist / (T.camDist + T.D / 2 - selected.pos.z)) * (T.aspect < 1 ? 0.8 : 1) * (6 / T.H) * (innerHeight / 700);
    m.style.left = px + 'px'; m.style.top = py + 'px'; m.style.width = m.style.height = Math.max(40, sz) + 'px';
  }
  tempT += dt;
  if (tempT > 4) { tempT = 0; $('#mTemp').textContent = (24.4 + Math.sin(t * 0.01) * 0.3 + Math.random() * 0.1).toFixed(1); }
  renderer.render(scene, camera);
  // adaptive resolution
  ftAcc += raw; ftN++;
  if (now - lastAdj > 2500) {
    const avg = ftAcc / ftN;
    if (avg > 0.024 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - 0.25); renderer.setPixelRatio(pixelRatio); onResize(); }
    else if (avg < 0.0135 && pixelRatio < maxPR) { pixelRatio = Math.min(maxPR, pixelRatio + 0.25); renderer.setPixelRatio(pixelRatio); onResize(); }
    ftAcc = 0; ftN = 0; lastAdj = now;
  }
}
requestAnimationFrame(frame);
})();
</script>
