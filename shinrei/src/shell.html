<title>心霊写真は盛れない</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen night-school game. Pixel canvas on top, touch pad below. Deliberately single dark theme. */
:root{
  --void:#07060b;      /* outside the screen */
  --ink:#ece6d6;       /* chalk-white text */
  --dim:#8f8a9e;       /* faded captions */
  --blood:#e0203a;     /* Misaka's eyes / warnings */
  --panel:#0d0b18;     /* message window */
  --edge:#dcd5c2;      /* window border */
  --aki:#a6f23c;       /* Aki's eyes / mystery */
  --gold:#f0e2b0;      /* kindness */
  --pix:'DotGothic16','Hiragino Kaku Gothic ProN','MS Gothic',monospace;
  --s:2px;             /* CSS px per game pixel, set by JS */
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--ink)}
body{margin:0;overflow:hidden;font-family:var(--pix);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:16px;padding-block:8px;box-sizing:border-box;gap:12px}
#screen{position:relative;flex:none;overflow:hidden;background:#000;touch-action:none;box-shadow:0 0 0 1px #1d1a28,0 0 40px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.layer{position:absolute;inset:0;pointer-events:none}

/* ---------- message window ---------- */
#msg{position:absolute;inset:0;pointer-events:none}
#msg[hidden]{display:none!important}
.por{position:absolute;bottom:0;height:96%;opacity:0;transition:opacity .18s,transform .25s;pointer-events:none;image-rendering:auto;filter:drop-shadow(0 0 calc(var(--s)*2) #000)}
.por.L{left:-4%;transform:translateX(-8%)}
.por.R{right:-3%;transform:translateX(8%)}
.por.on{opacity:1;transform:none}
.por.shake{animation:pshake .28s steps(2) 2}
.por.pale{filter:grayscale(.7) brightness(.75) drop-shadow(0 0 calc(var(--s)*2) #000)}
.por.dark{filter:brightness(.35) drop-shadow(0 0 calc(var(--s)*2) #000)}
.por.red{filter:sepia(1) saturate(4) hue-rotate(-40deg) brightness(.7)}
.por.hop{animation:phop .3s steps(3)}
@keyframes pshake{0%{translate:calc(var(--s)*-3) 0}50%{translate:calc(var(--s)*3) 0}100%{translate:0 0}}
@keyframes phop{0%{translate:0 0}50%{translate:0 calc(var(--s)*-5)}100%{translate:0 0}}
.win{position:absolute;left:2.5%;right:2.5%;bottom:3%;min-height:31%;box-sizing:border-box;padding:calc(var(--s)*6) calc(var(--s)*8) calc(var(--s)*5);
  background:linear-gradient(180deg,rgba(22,18,44,.93),rgba(8,6,18,.95));
  border:var(--s) solid var(--edge);box-shadow:0 0 0 var(--s) #000,inset 0 0 0 var(--s) #000,inset 0 0 0 calc(var(--s)*2) #3a3450;
  font-size:max(13px,calc(var(--s)*8.4));line-height:1.6;letter-spacing:.02em;pointer-events:auto}
.name{position:absolute;left:calc(var(--s)*6);top:calc(var(--s)*-9);padding:0 calc(var(--s)*5);background:var(--panel);border:var(--s) solid var(--edge);font-size:max(12px,calc(var(--s)*7.2));line-height:1.5}
.name[hidden]{display:none!important}
.name.misaka{color:#ffd2d9}.name.aki{color:var(--aki)}.name.yuki{color:var(--blood)}
#mtext{white-space:pre-wrap;word-break:break-all;min-height:3.2em}
#mtext .r{color:var(--blood)} #mtext .g{color:var(--aki)} #mtext .y{color:var(--gold)} #mtext .d{color:var(--dim)}
#mtext .b{font-size:1.35em;line-height:1.1}
#mtext .s{display:inline-block;animation:cshake .12s steps(2) infinite}
#mtext .hid{visibility:hidden}
@keyframes cshake{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
#mnext{position:absolute;right:calc(var(--s)*6);bottom:calc(var(--s)*2);color:var(--edge);animation:blink .6s steps(2) infinite;font-size:.8em}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.choices button,.menu button{all:unset;cursor:pointer;padding:1px 0 1px 1.4em;position:relative;font-family:var(--pix)}
.choices button.sel::before,.menu button.sel::before{content:'▶';position:absolute;left:.2em;color:var(--blood);animation:blink .8s steps(2) infinite}
.choices button:focus-visible,.menu button:focus-visible,.ovbtn:focus-visible{outline:1px dashed var(--aki)}

/* ---------- toasts ---------- */
#where{position:absolute;left:calc(var(--s)*4);top:calc(var(--s)*4);padding:calc(var(--s)*1) calc(var(--s)*5);background:rgba(8,6,16,.8);border-left:calc(var(--s)*2) solid var(--blood);font-size:max(12px,calc(var(--s)*7));opacity:0;transition:opacity .4s}
#where.on{opacity:1}
#toasts{position:absolute;right:calc(var(--s)*4);top:calc(var(--s)*4);display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--s)*2)}
.toast{padding:0 calc(var(--s)*4);background:rgba(6,5,12,.85);border:1px solid currentColor;font-size:max(11px,calc(var(--s)*6.5));animation:tin 2.4s forwards}
@keyframes tin{0%{opacity:0;transform:translateX(20%)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ---------- overlay panels (puzzles, docs, photos, menu) ---------- */
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,2,8,.72);pointer-events:auto}
#ov[hidden]{display:none!important}
.panel{max-width:92%;max-height:92%;overflow:auto;box-sizing:border-box;background:var(--panel);border:var(--s) solid var(--edge);box-shadow:0 0 0 var(--s) #000,inset 0 0 0 var(--s) #000;padding:calc(var(--s)*6);font-size:max(12px,calc(var(--s)*7.4));line-height:1.6}
.panel h3{margin:0 0 .4em;font-weight:normal;color:var(--gold);font-size:1.1em}
.panel .cap{color:var(--dim);font-size:.9em;margin-top:.4em;white-space:pre-wrap}
.paper{background:#d9d2bf;color:#2a2320;border:none;box-shadow:0 0 0 var(--s) #000,calc(var(--s)*2) calc(var(--s)*2) 0 #000;font-family:var(--pix);white-space:pre-wrap;max-width:88%}
.paper h3{color:#6a1420}
.paper .ink{color:#9a1a22}
.paper .smear{background:#2a2320;color:#2a2320}
.pixcv{display:block;image-rendering:pixelated;margin:0 auto;max-width:100%}
.polaroid{background:#e9e5da;padding:calc(var(--s)*5) calc(var(--s)*5) calc(var(--s)*14);box-shadow:calc(var(--s)*2) calc(var(--s)*2) 0 #000;transform:rotate(-1.5deg);position:relative;color:#2a2622;animation:dev 1.1s ease-out}
.polaroid .cap{position:absolute;left:0;right:0;bottom:calc(var(--s)*3);text-align:center;color:#3a3430;font-size:max(12px,calc(var(--s)*6.6))}
@keyframes dev{0%{filter:brightness(3) contrast(.2)}100%{filter:none}}
.row{display:flex;gap:calc(var(--s)*3);justify-content:center;flex-wrap:wrap;margin-top:calc(var(--s)*4)}
.ovbtn{all:unset;cursor:pointer;box-sizing:border-box;min-width:2.4em;text-align:center;padding:calc(var(--s)*2) calc(var(--s)*4);border:1px solid var(--edge);background:#1a1628;font-family:var(--pix)}
.ovbtn:active,.ovbtn.hit{background:var(--blood);color:#fff}
.slots{display:flex;gap:calc(var(--s)*3);justify-content:center;font-size:1.6em;margin:.3em 0}
.slots span{width:1.4em;height:1.4em;line-height:1.4em;text-align:center;border:1px solid var(--dim);background:#07060c}
.keys{display:flex;justify-content:center;margin-top:calc(var(--s)*4)}
.keys button{all:unset;cursor:pointer;width:2.3em;height:5.2em;background:#e6e1d4;color:#322;border:1px solid #000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.3em;box-sizing:border-box;font-family:var(--pix);font-size:.85em}
.keys button.sel{outline:2px solid var(--blood);outline-offset:-3px}
.keys button:active,.keys button.hit{background:#b9a;}
.menu{display:flex;flex-direction:column;gap:3px;min-width:9em}
.menu .sub{color:var(--dim);font-size:.85em;margin-top:.5em}
.items{display:grid;grid-template-columns:1fr;gap:2px}
.stats{color:var(--dim);font-size:.85em;margin-top:.6em;font-variant-numeric:tabular-nums}

/* ---------- novel (prologue / endings) ---------- */
#novel{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;justify-content:center;padding:6% 9%;box-sizing:border-box;font-size:max(13px,calc(var(--s)*8));line-height:1.9;pointer-events:auto;overflow:hidden}
#novel[hidden]{display:none!important}
#novel p{margin:0 0 .15em;white-space:pre-wrap;animation:nin .5s both}
#novel p.say{padding-left:1em;text-indent:-1em}
#novel p.misaka{color:#ffd2d9}#novel p.aki{color:var(--aki)}#novel p.yuki{color:var(--blood)}
#novel p.big{font-size:1.6em;text-align:center;color:var(--ink);letter-spacing:.2em;margin:.4em 0}
#novel p.c{text-align:center}
#novel p.dim{color:var(--dim)}
#novel .tap{position:absolute;right:6%;bottom:4%;color:var(--dim);animation:blink 1s steps(2) infinite;font-size:.8em}
@keyframes nin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7%;pointer-events:auto}
#title[hidden]{display:none!important}
.logo{font-size:calc(var(--s)*19);letter-spacing:.06em;color:var(--ink);text-shadow:calc(var(--s)*1) 0 0 var(--blood),calc(var(--s)*-1) 0 0 #3af,0 calc(var(--s)*2) 0 #000;animation:logo 5s steps(1) infinite;white-space:nowrap}
.logo em{font-style:normal;color:var(--blood);text-shadow:0 calc(var(--s)*2) 0 #000}
@keyframes logo{0%,92%,100%{transform:none;clip-path:none}93%{transform:translateX(calc(var(--s)*3));clip-path:inset(20% 0 40% 0)}95%{transform:translateX(calc(var(--s)*-2))}}
.sublogo{font-size:max(11px,calc(var(--s)*6.4));color:var(--dim);letter-spacing:.3em;margin-top:.4em}
.tmenu{margin-top:auto;margin-bottom:9%;background:rgba(8,6,16,.82);border:var(--s) solid var(--edge);padding:calc(var(--s)*4) calc(var(--s)*10);font-size:max(13px,calc(var(--s)*8))}
.cleared{position:absolute;right:calc(var(--s)*4);bottom:calc(var(--s)*3);font-size:max(11px,calc(var(--s)*6));color:var(--dim)}

#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s linear;z-index:10}
#msg{z-index:2}#title{z-index:3}#novel{z-index:4}#ov{z-index:5}#where,#toasts{z-index:6}

/* ---------- touch pad ---------- */
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;touch-action:none;flex:none}
.touch #pad{display:flex}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px)}
.dpad button,.abtn{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#16131f;border:2px solid #3b3550;color:var(--ink);font-family:var(--pix);touch-action:none}
.dpad button{font-size:20px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.dpad .c{grid-area:2/2;background:#0e0c15;border-color:#231f30}
.dpad button.on,.abtn.on{background:#3b1621;border-color:var(--blood)}
.btns{display:grid;grid-template-columns:64px 64px;grid-template-rows:64px 64px;gap:10px;align-items:center}
.abtn{border-radius:50%;width:64px;height:64px;flex-direction:column;font-size:13px;line-height:1.1;text-align:center}
.abtn b{font-weight:normal;font-size:20px}
.abtn.a{grid-area:1/2;border-color:var(--edge)}
.abtn.cam{grid-area:2/1;border-color:var(--blood)}
.abtn.b{grid-area:2/2}
.abtn.h{grid-area:1/1;border-color:#3d5a20;color:var(--aki)}
#keys{color:var(--dim);font-size:13px;text-align:center;line-height:1.8;max-width:760px}
#keys kbd{font-family:var(--pix);border:1px solid #3b3550;padding:0 .35em;background:#12101b;color:var(--ink)}
.touch #keys{display:none}
@media (prefers-reduced-motion:reduce){.logo,#mtext .s,.polaroid{animation:none}}
</style>

<div id="app">
  <div id="screen">
    <canvas id="cv" width="256" height="192"></canvas>
    <div id="where"></div>
    <div id="toasts" class="layer"></div>
    <div id="msg" hidden>
      <img id="pl" class="por L" alt="" src="%%MISAKA%%">
      <img id="pr" class="por R" alt="" src="%%AKI%%">
      <div class="win" data-own>
        <div id="mname" class="name" hidden></div>
        <div id="mtext"></div>
        <div id="mchoice" class="choices" hidden></div>
        <div id="mnext">▼</div>
      </div>
    </div>
    <div id="ov" hidden></div>
    <div id="novel" hidden></div>
    <div id="title" hidden>
      <div class="logo">心霊写真は<em>盛れない</em></div>
      <div class="sublogo">― 縦内ミサカの不法侵入記 ―</div>
      <div class="tmenu menu" id="tmenu"></div>
      <div class="cleared" id="cleared"></div>
    </div>
    <div id="fade"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="上">▲</button>
      <button class="l" data-k="left" aria-label="左">◀</button>
      <button class="c" tabindex="-1" aria-hidden="true"></button>
      <button class="r" data-k="right" aria-label="右">▶</button>
      <button class="d" data-k="down" aria-label="下">▼</button>
    </div>
    <div class="btns">
      <button class="abtn h" data-k="hint"><b>猫</b>ヒント</button>
      <button class="abtn a" data-k="ok"><b>A</b>調べる</button>
      <button class="abtn cam" data-k="cam"><b>◉</b>撮る</button>
      <button class="abtn b" data-k="cancel"><b>B</b>メニュー</button>
    </div>
  </div>
  <div id="keys">
    <kbd>↑↓←→</kbd>/<kbd>WASD</kbd> 移動　<kbd>Shift</kbd> ダッシュ　<kbd>Z</kbd>/<kbd>Enter</kbd>/<kbd>Space</kbd> 調べる・決定　<kbd>X</kbd>/<kbd>Esc</kbd> メニュー・戻る　<kbd>C</kbd> 撮る　<kbd>H</kbd> アキにヒント<br>
    画面タップ／クリックでその場所まで歩きます
  </div>
</div>
